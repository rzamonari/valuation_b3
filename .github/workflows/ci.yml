# Definição de pronto (plan.md §7) a cada push e pull request: lint, formatação e testes com
# cobertura mínima (fail_under do pyproject.toml). Sem rede nem banco real: os testes criam
# bancos DuckDB temporários.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: requirements.txt em dia com o uv.lock (Streamlit Cloud)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --locked -q -o requirements.txt
          git diff --exit-code requirements.txt
      - name: fotografia versionada íntegra (hashes do manifesto)
        run: uv run python -m pipeline.fotografia --verificar

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows é o ambiente de desenvolvimento (lock de arquivo do DuckDB, caminhos).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: pytest (cobertura obrigatória)
        run: uv run pytest
