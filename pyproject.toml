[project]
name = "valuationb3"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.8.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# Os testes de contrato (rede real) ficam fora do padrão: uv run pytest test/contrato -m contrato --no-cov
addopts = '--cov -m "not contrato"'
markers = [
    "contrato: chamada real a uma fonte externa, contra o formato esperado (test/contrato/)",
]

[tool.coverage.run]
source = ["."]
omit = ["test/*", "app.py", "ui.py", ".venv/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.pycodestyle]
# O formatter mantém o código em 88 colunas; docstrings, comentários e SQL em strings
# seguem a margem de 100 colunas já usada no projeto.
max-line-length = 100

[tool.taskipy.tasks]
test = { cmd = "pytest", help = "testes com cobertura (fail_under 85)" }
contrato = { cmd = "pytest test/contrato -m contrato --no-cov", help = "contrato das 4 fontes (rede real)" }
lint = { cmd = "ruff check . && ruff format . --check", help = "lint e verificação de formatação" }
format = { cmd = "ruff check . --fix && ruff format .", help = "corrige lint (inclui imports) e formata" }
docs = { cmd = "mkdocs serve", help = "documentação em http://127.0.0.1:8000" }
qualidade = { cmd = "python -m pipeline.qualidade", help = "reconciliação raw -> refined -> marts e regras de domínio" }
fotografia = { cmd = "python -m pipeline.fotografia", help = "exporta a fotografia versionada da Gold (exige qualidade sem erros)" }
