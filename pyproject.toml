[project]
name = "valuationb3"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.8.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "--cov"

[tool.coverage.run]
source = ["."]
omit = ["test/*", "app.py", "ui.py", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# O comprimento de linha é responsabilidade do `ruff format` (88). O que ele não quebra
# (strings longas, SQL, URLs e comentários separadores) não vale reescrita manual.
ignore = ["E501"]

[tool.taskipy.tasks]
docs = { cmd = "mkdocs serve", help = "pré-visualiza a documentação em http://127.0.0.1:8000" }
docs-build = { cmd = "mkdocs build --strict", help = "gera o site em site/ e falha com link quebrado" }
